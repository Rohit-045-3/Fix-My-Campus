{% extends "base.html" %}
{% block title %}Sign in | FixMyCampus{% endblock %}
{% block content %}
<section class="auth-section"><div class="auth-card"><div class="auth-symbol"><i class="bi bi-buildings-fill"></i></div><div class="eyebrow text-center">WELCOME BACK</div><h1>Sign in to FixMyCampus</h1><p class="auth-subtitle">Pick up where you left off and keep your campus moving forward.</p>
<form method="post" class="mt-4">
<div class="mb-3"><label class="form-label">Email address</label><input class="form-control form-control-lg" type="email" name="email" placeholder="you@college.edu" required autocomplete="email"></div>
<div class="mb-3"><label class="form-label">Password</label><input class="form-control form-control-lg" type="password" name="password" placeholder="Enter your password" required autocomplete="current-password"></div>
<button class="btn btn-primary btn-lg w-100 rounded-pill mt-2">Sign in <i class="bi bi-arrow-right ms-2"></i></button>
</form><p class="auth-bottom">New to FixMyCampus? <a href="{{ url_for('register') }}">Create an account</a></p></div></section>
{% endblock %}
